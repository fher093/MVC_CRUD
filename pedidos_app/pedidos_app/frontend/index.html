<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="banner">
        <h1>Sistema de Pedidos</h1>
        <p>Jabon · Shampoo · Pasta dental</p>
    </header>

    <nav class="nav">
        <a href="#" class="tab activo" data-seccion="registrar">Registrar pedido</a>
        <a href="#" class="tab" data-seccion="clientes">Clientes</a>
        <a href="#" class="tab" data-seccion="historial">Pedidos por cliente</a>
    </nav>

    <main>
        <div id="mensaje" class="mensaje oculto"></div>

        <!-- 1. Registrar pedido -->
        <section id="registrar" class="seccion">
            <h2>Registrar nuevo pedido</h2>
            <label>Cliente (Apellido Nombre)</label>
            <select id="selCliente"></select>

            <label>Producto</label>
            <select id="selProducto"></select>

            <label>Cantidad</label>
            <input type="number" id="cantidad" min="1" value="1">

            <p class="total">Total: $<span id="totalPedido">0.00</span></p>
            <button id="btnRegistrar">Registrar pedido</button>
        </section>

        <!-- 2. Clientes -->
        <section id="clientes" class="seccion oculto">
            <h2>Consultar clientes</h2>
            <div class="fila">
                <input type="text" id="txtCedula" maxlength="10" placeholder="Cédula (10 dígitos)">
                <button id="btnBuscar">Buscar</button>
                <button id="btnTodos" class="secundario">Listar todos</button>
            </div>
            <table>
                <thead>
                    <tr><th>Cédula</th><th>Cliente</th><th>Teléfono</th><th>Dirección</th></tr>
                </thead>
                <tbody id="tbClientes"></tbody>
            </table>
        </section>

        <!-- 3. Historial -->
        <section id="historial" class="seccion oculto">
            <h2>Pedidos realizados por cliente</h2>
            <label>Cliente (Apellido Nombre)</label>
            <select id="selClienteHistorial"></select>
            <table>
                <thead>
                    <tr><th>N° Pedido</th><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Total</th><th>Fecha</th></tr>
                </thead>
                <tbody id="tbPedidos"></tbody>
            </table>
        </section>
    </main>

    <footer><p>Derechos reservados 2026</p></footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
